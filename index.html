<style>

  #card .v { font-size:13px; color:var(--cream); line-height:1.4; overflow-wrap:anywhere; }
  #card .v.sub { font-size:11px; color:var(--mute); }
  #card .v.none { color:var(--mute); }

  #card .act .arr { margin-left:6px; font-family:'Outfit',sans-serif; font-weight:600; }

  #legend .sep { color:rgba(var(--ink-rgb),.22); }

  #legend .st { flex:0 0 auto; color:var(--accent); font-weight:500; }
  #legend .st:empty { display:none; }

</head>

const TERM_PORT = 5075;

const CUR_DEF = 'var(--cur-hex), default', CUR_NODE = 'var(--cur-hex-fill), pointer';
function getNodeAt(mx, my) {
  for (const n of AGS) { const dx = mx - n.x, dy = my - n.y; if (dx*dx + dy*dy <= n.radius*n.radius) return n; }
  for (const n of SUBS) { if (n.gone) continue; const dx = mx - n.x, dy = my - n.y; if (dx*dx + dy*dy <= n.radius*n.radius) return n; }
  for (const n of TOOLS) { if (n.gone) continue; const dx = mx - n.x, dy = my - n.y; if (dx*dx + dy*dy <= (n.radius + 4)*(n.radius + 4)) return n; }

}
cv.addEventListener('pointermove', ev => {

  if (spaceHeld) return;
  if (DRAG) { DRAG.x = ev.clientX - panX; DRAG.y = ev.clientY - panY; return; }
  const n = getNodeAt(ev.clientX - panX, ev.clientY - panY);
  HOVER = n; cv.style.cursor = n ? CUR_NODE : CUR_DEF;
  if (n) showTip(n, ev.clientX, ev.clientY); else tip.style.display = 'none';
});
cv.addEventListener('pointerdown', ev => {
  pressX = ev.clientX; pressY = ev.clientY; pressNode = null;
  if (spaceHeld) {
    panning = true; panStartX = ev.clientX; panStartY = ev.clientY; panOX = panX; panOY = panY;
    cv.style.cursor = 'grabbing'; tip.style.display = 'none';
    try { cv.setPointerCapture(ev.pointerId); } catch (e) {}
    ev.preventDefault(); return;
  }
  const n = getNodeAt(ev.clientX - panX, ev.clientY - panY);
  pressNode = n;
  if (!n) return;
  DRAG = n; n.vx = 0; n.vy = 0; HOVER = n;
  tip.style.display = 'none';
  try { cv.setPointerCapture(ev.pointerId); } catch (e) {}
  ev.preventDefault();
});
function release(ev) {
  const moved = ev && ev.type === 'pointerup' ? Math.hypot(ev.clientX - pressX, ev.clientY - pressY) : 99;
  if (ev && ev.type === 'pointerup' && !panning && moved < 4) {
    if (pressNode && (pressNode.type === 'agent' || pressNode.type === 'sub')) openCard(pressNode);
    else if (!pressNode) closeCard();
  }
  DRAG = null; pressNode = null;
  if (panning) { panning = false; cv.style.cursor = spaceHeld ? 'grab' : CUR_DEF; }
  if (ev && ev.type === 'pointerleave') { HOVER = null; tip.style.display = 'none'; }
}
cv.addEventListener('pointerup', release);
cv.addEventListener('pointercancel', release);
cv.addEventListener('pointerleave', release);
addEventListener('keydown', ev => {
  if (ev.code !== 'Space' || ev.target.tagName === 'BUTTON') return;
  ev.preventDefault();
  if (!spaceHeld) { spaceHeld = true; cv.style.cursor = 'grab'; HOVER = null; tip.style.display = 'none'; }
});
addEventListener('keyup', ev => {
  if (ev.code !== 'Space') return;
  ev.preventDefault();
  spaceHeld = false; panning = false; cv.style.cursor = CUR_DEF;
});

let demoK = 0, demoTimer = 0, demoT0 = 0;
const demoState = {};
function demoNow() { return demoT0 + demoK*DEMO_MS; }
function demoReset() {
  demoK = 0; demoT0 = Date.now();
  AG_ORDER.forEach((id, i) => { demoState[id] = { cursor: Math.floor(osPn(i, 42)*DEMO_POOL[id].length), hist: [], subs: [], subN: 0, lastAdv: -9 }; });
  for (let k = 0; k < 4; k++) demoAdvance(k, true);
}
function demoAdvance(k, silent) {
  const now = demoT0 + k*DEMO_MS;
  AG_ORDER.forEach((id, i) => {
    const st = demoState[id];
    const go = ((k + i) % 3) !== 2 || k - st.lastAdv > 2;
    if (!go) return;
    const pool = DEMO_POOL[id];
    const item = pool[st.cursor % pool.length]; st.cursor++;
    const t = { name:item[0], detail:item[1], kind:item[2], at:new Date(now).toISOString() };
    if (item[2] === 'memory') t.op = item[3];
    st.hist.push(t); if (st.hist.length > 8) st.hist.shift();
    st.lastAdv = k;
    if (item[2] === 'subagent' && st.subs.filter(s => !s.done).length < DEMO_SUB_MAX_RUNNING) {
      st.subN++;
      st.subs.push({ id:'demo' + id + i + st.subN + k, type:item[3], detail:item[1], at:t.at, done:false, k,
                     model:DEMO_SUB_MODEL[(st.subN + i) % DEMO_SUB_MODEL.length], seed:st.subN + i, tools:[], toolRunning:true });
      if (st.subs.length > 3) st.subs.shift();
    }
    st.subs.forEach(s => {
      if (s.done) return;
      if (k - s.k >= DEMO_SUB_RUN_TICKS) { s.done = true; s.doneAt = new Date(now).toISOString(); s.toolRunning = false; return; }
      if (s.tools.length < DEMO_SUB_TRAIL) {
        const it = DEMO_SUB_POOL[(s.seed + s.tools.length) % DEMO_SUB_POOL.length];
        s.tools.push({ name:it[0], detail:it[1], kind:it[2], at:new Date(now).toISOString() });
      }

    agents: AG_ORDER.map(id => {
      const st = demoState[id];
      const pr = pairs.find(p => p[0] === id || p[1] === id);
      const status = id === thinking ? 'thinking' : id === waiting && id !== thinking ? 'waiting' : 'active';
      return {
        id, name:AG_NAME[id], status, lastTask:DEMO_TASK[id],
        tools: st.hist.slice(), toolRunning: k - st.lastAdv <= 1 && status === 'active',
        subagents: st.subs.map(s => {

}
